<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catedral Cristiana · Elegí tu iglesia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=Sora:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
    <main class="landing">
        <div class="landing-pattern" aria-hidden="true">
            <svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <pattern id="sacred-grid" width="80" height="80" patternUnits="userSpaceOnUse">
                        <circle cx="40" cy="40" r="38" fill="none" stroke="white" stroke-width="0.5"/>
                        <circle cx="40" cy="40" r="28" fill="none" stroke="white" stroke-width="0.3"/>
                        <circle cx="40" cy="40" r="14" fill="none" stroke="white" stroke-width="0.3"/>
                        <line x1="2" y1="40" x2="78" y2="40" stroke="white" stroke-width="0.2"/>
                        <line x1="40" y1="2" x2="40" y2="78" stroke="white" stroke-width="0.2"/>
                    </pattern>
                </defs>
                <rect width="100%" height="100%" fill="url(#sacred-grid)"/>
            </svg>
        </div>

        <div class="landing-cta">
            <div class="animate" style="animation-delay:0.05s">
                <div class="landing-logo-circle">
                    <img class="landing-logo" src="https://lh4.googleusercontent.com/proxy/X36awiu818-wXr4Llh1Cp9n6RhnzkEwdgqfEJQN_56SNYFc5W9Ljbr9zVTKZmPeW_4PmNa4McjPjHgqtTyMbZBa-BbCO3mI4mfRxLHa80zLoJNzPuk8yzYBS76w" alt="Catedral Cristiana">
                </div>
            </div>

            <h1 class="landing-title animate" style="animation-delay:0.1s">Catedral Cristiana</h1>
            <p class="landing-sub animate" style="animation-delay:0.15s">Elegí tu sede para acceder a la plataforma</p>

            <nav class="landing-cards animate" style="animation-delay:0.2s">
                <a class="landing-card" href="https://cconce.ipsargentina.net">
                    <span class="landing-card-title">Catedral Cristiana Once</span>
                    <span class="landing-card-arrow" aria-hidden="true">&rarr;</span>
                </a>
                <a class="landing-card" href="https://ccva.ipsargentina.net">
                    <span class="landing-card-title">Catedral Cristiana Villa Adelina</span>
                    <span class="landing-card-arrow" aria-hidden="true">&rarr;</span>
                </a>
            </nav>

            <p class="landing-footer animate" style="animation-delay:0.25s">Catedral Cristiana</p>
        </div>
    </main>

    <script src="assets/js/app.js"></script>
</body>
</html>
